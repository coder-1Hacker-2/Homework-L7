<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Book Donation Form</title>
    </head>
    <body>
        
        <h1>This is a form for donating books to our school library! </h1>


        <form>
            <fieldset>
                <legend>Donor Details</legend>

                <label>Your Name:</label>
                <input type="text" id="name" placeholder="Enter your full name please!"><br><br>

                <label>Donor ID</label>
                <input type="password" id="pid" placeholder="Your password goes here."><br><br>

                <label>Donation Date</label>
                <input type="date" id="DO donation"><br>

            </fieldset>

            <br>

            <fieldset>
                <legend>Book category</legend><br>
                <select id="Book">
                    <option value="fiction">Fiction</option>
                    <option value="history">History</option>
                    <option value="science">Science</option>
                    <option value="education">Education</option>
                </select>

                <label>Book condition</label><br>
                <input type="radio" name="condition" value="new">New<br>
                <input type="radio" name="condition" value="good">Good<br>
                <input type="radio" name="condition" value="fair">Fair<br>
                <input type="radio" name="condition" value="poor">Poor<br>

                <label>Any notes for library?</label><br>
                <textarea id="notes" rows="3" cols="35" placeholder="e.g. This is my favourtie book, please keep it safe!"></textarea> <br>

            </fieldset>

            <br>

            <fieldset>

                <legend>Drop-off days</legend>
                <input type="checkbox" value="mon">Monday</input><br> 
                <input type="checkbox" value="tue">Tuesday</input><br> 
                <input type="checkbox" value="wed">Wednesday</input><br>    
                <input type="checkbox" value="thu">Thursday</input><br> 
                <input type="checkbox" value="fri">Friday</input>  <br> 
                <input type="checkbox" value="sat">Saturday</input><br> 
                <input type="checkbox" value="sun">Sunday</input> <br> 


            </fieldset>

            <br>

            <input type="submit" value="Donate My Book!">


        </form>
        
    </body>
</html>
